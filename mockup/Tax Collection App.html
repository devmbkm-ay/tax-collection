<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1600"/>
  <title>Transfèr — Three directions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet"/>

  <style>
    html, body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #efe9df; }
    #root { width: 100vw; min-height: 100vh; }
    button { font-family: inherit; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="foyer.jsx"></script>
  <script type="text/babel" src="comptoir.jsx"></script>
  <script type="text/babel" src="cahier.jsx"></script>
  <script type="text/babel" src="atlas.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "dashboardLayout": "cards"
    }/*EDITMODE-END*/;

    const ART_W = 1240;
    const ART_H = 880;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const layout = t.dashboardLayout || 'cards';

      return (
        <React.Fragment>
          <DesignCanvas>
            <DCSection id="intro" title="Transfèr · Tax-collection app" subtitle="Three warm & approachable directions — same flow, different design language. Each artboard is fully interactive (FR/EN, click through Source → Import → Dashboard → PDF preview). Use the Tweaks panel to swap dashboard layouts.">
              <DCArtboard id="foyer" label="A · Foyer — soft modern" width={ART_W} height={ART_H}>
                <FoyerApp layout={layout} />
              </DCArtboard>
              <DCArtboard id="comptoir" label="B · Comptoir — friendly civic" width={ART_W} height={ART_H}>
                <ComptoirApp layout={layout} />
              </DCArtboard>
              <DCArtboard id="cahier" label="C · Cahier — paper ledger" width={ART_W} height={ART_H}>
                <CahierApp layout={layout} />
              </DCArtboard>
              <DCArtboard id="atlas" label="D · Atlas — modern app shell" width={ART_W} height={ART_H}>
                <AtlasApp layout={layout} />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel>
            <TweakSection label="Dashboard layout" />
            <TweakRadio
              label="Layout"
              value={layout}
              options={['cards', 'table', 'charts']}
              onChange={(v) => setTweak('dashboardLayout', v)}
            />
            <div style={{ fontSize: 11, color: '#7a7065', padding: '8px 12px 14px', lineHeight: 1.5 }}>
              <b>Cards</b> · breakdown by country &amp; recipient<br/>
              <b>Table</b> · all transactions, ledger view<br/>
              <b>Charts</b> · monthly bars + country donut
            </div>
            <TweakSection label="Tip" />
            <div style={{ fontSize: 11, color: '#7a7065', padding: '0 12px 14px', lineHeight: 1.55 }}>
              Each artboard has its own FR/EN toggle and step state. Click any source card to walk through the flow. From the dashboard, hit “Export PDF” to see the report preview.
            </div>
          </TweaksPanel>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
