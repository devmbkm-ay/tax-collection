services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - MONGODB_URI
      - CORS_ORIGINS
      - DB_PATH
    volumes:
      - db_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

# Named volume for SQLite — unused when MONGODB_URI is set
volumes:
  db_data:
