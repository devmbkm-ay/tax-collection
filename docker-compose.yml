services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - DB_PATH=${DB_PATH:-}
    volumes:
      - db_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

# Named volume for SQLite — unused when MONGODB_URI is set
volumes:
  db_data:
